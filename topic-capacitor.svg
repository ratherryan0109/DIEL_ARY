<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="capTitle">
  <title id="capTitle">A parallel plate capacitor with labelled plate area, separation and dielectric</title>
  <defs>
    <linearGradient id="cap-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#EDE6FF"/>
    </linearGradient>
    <linearGradient id="cap-slab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B9FFF5"/>
      <stop offset="1" stop-color="#2BC7B5"/>
    </linearGradient>
    <pattern id="cap-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6C4DE6" stroke-opacity=".05"/>
    </pattern>
    <filter id="cap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4B2FC9" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#cap-bg)"/>
  <rect width="800" height="500" rx="28" fill="url(#cap-grid)"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g filter="url(#cap-shadow)">
      <rect x="178" y="118" width="444" height="18" rx="9" fill="#6C4DE6"/>
      <rect x="178" y="366" width="444" height="18" rx="9" fill="#6C4DE6"/>
      <rect x="218" y="178" width="364" height="142" rx="18" fill="url(#cap-slab)" opacity=".9"/>
      <rect x="218" y="178" width="364" height="142" rx="18" fill="none" stroke="#0E8E82" stroke-width="1.5" opacity=".45"/>
      <path d="M178 118l24-22h444l-24 22z" fill="#8B6CF6" opacity=".65"/>
      <path d="M622 118v18l24-22v-18z" fill="#4B2FC9" opacity=".55"/>
    </g>

    <g stroke="#7A68FF" stroke-width="2" stroke-dasharray="6 8" opacity=".7">
      <path d="M260 140v218M350 140v218M440 140v218M530 140v218"/>
    </g>
    <g fill="#7A68FF">
      <path d="M256 344l4 12 4-12zM346 344l4 12 4-12zM436 344l4 12 4-12zM526 344l4 12 4-12z"/>
    </g>

    <g fill="#FFFFFF" font-size="17" font-weight="800">
      <text x="198" y="133">+</text><text x="286" y="133">+</text><text x="374" y="133">+</text><text x="462" y="133">+</text><text x="550" y="133">+</text><text x="588" y="133">+</text>
      <text x="198" y="381">−</text><text x="286" y="381">−</text><text x="374" y="381">−</text><text x="462" y="381">−</text><text x="550" y="381">−</text><text x="588" y="381">−</text>
    </g>

    <g>
      <path d="M180 86h440" stroke="#F2A93B" stroke-width="2" stroke-linecap="round"/>
      <path d="M180 86l10-5v10zM620 86l-10-5v10z" fill="#F2A93B"/>
      <text x="400" y="74" fill="#8A5A0A" font-size="18" font-weight="800" text-anchor="middle">plate area A</text>
    </g>
    <g>
      <path d="M666 136v230" stroke="#0B6C64" stroke-width="2" stroke-linecap="round"/>
      <path d="M666 136l-5 10h10zM666 366l-5-10h10z" fill="#0B6C64"/>
      <text x="686" y="254" fill="#0B6C64" font-size="18" font-weight="800">d</text>
    </g>

    <text x="400" y="258" fill="#0B6C64" font-size="20" font-weight="800" text-anchor="middle">dielectric</text>
    <text x="400" y="280" fill="#0B6C64" font-size="14" text-anchor="middle">εr</text>

    <g filter="url(#cap-shadow)">
      <rect x="100" y="412" width="600" height="62" rx="18" fill="#FFFFFF" stroke="#E6DFFA"/>
      <text x="400" y="441" fill="#4B2FC9" font-size="22" font-weight="800" text-anchor="middle">C = ε₀ εr A / d</text>
      <text x="400" y="461" fill="#6F6A85" font-size="13" text-anchor="middle">A = plate area · d = separation · ε₀ = 8.854 × 10⁻¹² F/m</text>
    </g>
  </g>
</svg>
