<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="lossTitle">
  <title id="lossTitle">Phasor diagram of dielectric loss and a graph of loss tangent versus frequency</title>
  <defs>
    <linearGradient id="loss-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#EDE6FF"/>
    </linearGradient>
    <pattern id="loss-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6C4DE6" stroke-opacity=".05"/>
    </pattern>
    <filter id="loss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4B2FC9" flood-opacity=".1"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#loss-bg)"/>
  <rect width="800" height="500" rx="28" fill="url(#loss-grid)"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g filter="url(#loss-shadow)">
      <rect x="36" y="42" width="350" height="330" rx="22" fill="#FFFFFF" opacity=".94" stroke="#E6DFFA"/>
      <rect x="414" y="42" width="350" height="330" rx="22" fill="#FFFFFF" opacity=".94" stroke="#E6DFFA"/>
    </g>
    <text x="58" y="78" fill="#4B2FC9" font-size="19" font-weight="800">Why current is not exactly 90°</text>
    <text x="436" y="78" fill="#4B2FC9" font-size="19" font-weight="800">Loss changes with frequency</text>

    <g transform="translate(94 306)">
      <path d="M0 0h220" stroke="#CFC7EA" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 0v-190" stroke="#CFC7EA" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
      <path d="M0 0l150-145" stroke="#6C4DE6" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 0h190" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/>
      <path d="M150 0v-145" stroke="#6C4DE6" stroke-width="2" stroke-dasharray="5 6" opacity=".65"/>
      <path d="M0 -48a48 48 0 0 1 21 -38" fill="none" stroke="#0B6C64" stroke-width="2.5"/>
      <text x="18" y="-60" fill="#0B6C64" font-size="20" font-weight="800">δ</text>
      <text x="196" y="5" fill="#8A5A0A" font-size="17" font-weight="800">V</text>
      <text x="146" y="-154" fill="#4B2FC9" font-size="17" font-weight="800">I</text>
      <text x="76" y="24" fill="#8A5A0A" font-size="13" font-weight="700">in-phase loss</text>
      <text x="0" y="36" fill="#6F6A85" font-size="12">voltage reference</text>
    </g>

    <g transform="translate(470 300)">
      <path d="M0 0h236" stroke="#CFC7EA" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 0v-190" stroke="#CFC7EA" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 -36c18-30 30 18 48 12 22-8 18-74 44-76 25-2 20 64 44 62 20-2 22-42 40-40 18 2 18 30 34 28 14-2 16-12 26-12" fill="none" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 -18c20 0 26 4 38 10" fill="none" stroke="#F2A93B" stroke-width="2" opacity=".4"/>
      <text x="246" y="5" fill="#6F6A85" font-size="13" font-weight="700">log f</text>
      <text x="-6" y="-200" fill="#6F6A85" font-size="13" font-weight="700">tan δ</text>
      <g fill="#6F6A85" font-size="11">
        <text x="6" y="18">low f</text>
        <text x="88" y="18">relaxation</text>
        <text x="190" y="18">high f</text>
      </g>
      <g fill="#4B2FC9" font-size="11" font-weight="700">
        <text x="4" y="-48">conduction</text>
        <text x="76" y="-120">dipolar</text>
        <text x="154" y="-94">ionic</text>
        <text x="214" y="-66">electronic</text>
      </g>
    </g>

    <g filter="url(#loss-shadow)">
      <rect x="96" y="394" width="608" height="66" rx="20" fill="#FFFFFF" stroke="#E6DFFA"/>
      <text x="400" y="424" fill="#4B2FC9" font-size="22" font-weight="800" text-anchor="middle">tan δ = ε″ / ε′     ·     Q = 1 / tan δ</text>
      <text x="400" y="446" fill="#6F6A85" font-size="14" text-anchor="middle">ε″ is the lossy part; ε′ is the energy-storing part</text>
    </g>
  </g>
</svg>
