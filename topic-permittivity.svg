<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="perTitle">
  <title id="perTitle">A vacuum capacitor compared with a dielectric-filled capacitor at the same voltage</title>
  <defs>
    <linearGradient id="per-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#EDE6FF"/>
    </linearGradient>
    <linearGradient id="per-slab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B9FFF5"/>
      <stop offset="1" stop-color="#2BC7B5"/>
    </linearGradient>
    <pattern id="per-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6C4DE6" stroke-opacity=".05"/>
    </pattern>
    <filter id="per-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4B2FC9" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#per-bg)"/>
  <rect width="800" height="500" rx="28" fill="url(#per-grid)"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g filter="url(#per-shadow)">
      <rect x="38" y="42" width="344" height="330" rx="22" fill="#FFFFFF" opacity=".94" stroke="#E6DFFA"/>
      <rect x="418" y="42" width="344" height="330" rx="22" fill="#FFFFFF" opacity=".94" stroke="#E6DFFA"/>
    </g>
    <text x="60" y="78" fill="#4B2FC9" font-size="20" font-weight="800">Vacuum</text>
    <text x="60" y="100" fill="#6F6A85" font-size="14">εr = 1 exactly</text>
    <text x="440" y="78" fill="#4B2FC9" font-size="20" font-weight="800">Dielectric</text>
    <text x="440" y="100" fill="#6F6A85" font-size="14">εr &gt; 1</text>

    <g>
      <rect x="92" y="132" width="236" height="14" rx="7" fill="#6C4DE6"/>
      <rect x="92" y="310" width="236" height="14" rx="7" fill="#6C4DE6"/>
      <g stroke="#7A68FF" stroke-width="2" stroke-dasharray="5 7" opacity=".75">
        <path d="M130 146v164M180 146v164M230 146v164M280 146v164"/>
      </g>
      <g fill="#7A68FF"><path d="M126 286l4 11 4-11zM176 286l4 11 4-11zM226 286l4 11 4-11zM276 286l4 11 4-11z"/></g>
      <g fill="#FFFFFF" font-size="18" font-weight="800">
        <text x="142" y="145">+</text><text x="192" y="145">+</text><text x="242" y="145">+</text><text x="292" y="145">+</text>
        <text x="142" y="323">−</text><text x="192" y="323">−</text><text x="242" y="323">−</text><text x="292" y="323">−</text>
      </g>
      <text x="92" y="356" fill="#6F6A85" font-size="14">field lines in vacuum</text>
    </g>

    <g>
      <rect x="472" y="132" width="236" height="14" rx="7" fill="#6C4DE6"/>
      <rect x="472" y="310" width="236" height="14" rx="7" fill="#6C4DE6"/>
      <rect x="494" y="168" width="192" height="120" rx="14" fill="url(#per-slab)" opacity=".92"/>
      <rect x="494" y="168" width="192" height="120" rx="14" fill="none" stroke="#0E8E82" stroke-width="1.5" opacity=".5"/>
      <g stroke="#7A68FF" stroke-width="2" stroke-dasharray="5 7" opacity=".85">
        <path d="M510 146v164M560 146v164M610 146v164M660 146v164"/>
      </g>
      <g fill="#7A68FF"><path d="M506 286l4 11 4-11zM556 286l4 11 4-11zM606 286l4 11 4-11zM656 286l4 11 4-11z"/></g>
      <g fill="#FFFFFF" font-size="18" font-weight="800">
        <text x="522" y="145">+</text><text x="572" y="145">+</text><text x="622" y="145">+</text><text x="672" y="145">+</text>
        <text x="522" y="323">−</text><text x="572" y="323">−</text><text x="622" y="323">−</text><text x="672" y="323">−</text>
      </g>
      <text x="600" y="238" fill="#0B6C64" font-size="18" font-weight="800" text-anchor="middle">dielectric</text>
      <text x="472" y="356" fill="#6F6A85" font-size="14">field reduced, more charge stored</text>
    </g>

    <g>
      <path d="M382 208h36" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
      <path d="M418 208l-10-6v12z" fill="#F2A93B"/>
      <rect x="362" y="174" width="76" height="24" rx="12" fill="#FFF3DE"/>
      <text x="400" y="191" fill="#8A5A0A" font-size="12" font-weight="800" text-anchor="middle">same V</text>
    </g>

    <g filter="url(#per-shadow)">
      <rect x="120" y="394" width="560" height="66" rx="20" fill="#FFFFFF" stroke="#E6DFFA"/>
      <text x="400" y="424" fill="#4B2FC9" font-size="22" font-weight="800" text-anchor="middle">C = εr × C₀</text>
      <text x="400" y="446" fill="#6F6A85" font-size="14" text-anchor="middle">the dielectric multiplies capacitance, not the applied voltage</text>
    </g>
  </g>
</svg>
